name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract FinalApp Cloud Fixed ZIP
        run: |
          unzip -o FinalApp-CLOUD-FIXED.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          if [ -f "extracted/FinalApp/settings.gradle" ]; then
            echo "PROJECT_DIR=extracted/FinalApp" >> "$GITHUB_ENV"
          elif [ -f "extracted/settings.gradle" ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          else
            echo "Android project not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aryan-App-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
