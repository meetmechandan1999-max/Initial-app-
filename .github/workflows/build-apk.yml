name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Fixed Android Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q FinalApp_AddPhoto_FIXED.zip -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found"
            find extracted -maxdepth 4 -type d
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using SDK manager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip -d "$HOME"

          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --version

          gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR" -type f | head -200
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Aryan-App-Final.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aryan-App-Final
          path: Aryan-App-Final.apk
          if-no-files-found: error
