name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Project
        run: |
          unzip -o FinalApp.zip
          echo "===== Extracted files ====="
          find . -maxdepth 4 -type f | head -200

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          SETTINGS_FILE=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found."
            echo "Searching for Gradle files..."
            find . -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) -print
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          echo "Building project:"
          echo "${{ steps.project.outputs.project_dir }}"

          gradle \
            -p "${{ steps.project.outputs.project_dir }}" \
            assembleDebug \
            --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: app-debug.apk was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aryan-app-APK
          path: ${{ steps.apk.outputs.apk_path }}
